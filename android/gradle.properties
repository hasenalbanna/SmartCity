org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
rive.ndk.version=27.0.12077973
android.ndk.suppressMinSdkVersionError=21
# Disable Kotlin incremental/daemon to avoid cross-drive cache issues on Windows
kotlin.incremental=false
kotlin.daemon.enabled=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental.useClasspathSnapshot=false
